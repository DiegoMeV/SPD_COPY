name: Deploy SPD to Staging

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_SPD_CUSTOM_TITLE: ${{ vars.STAGING_NEXT_PUBLIC_SPD_CUSTOM_TITLE }}
      PRISMA_CLI_BINARY_TARGETS: ${{ vars.PRISMA_CLI_BINARY_TARGETS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build docker image
        run: sudo docker build -t fredygilsolinfo/spd-staging:latest .
      - name: Login to DockerHub
        run:
          sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD
          }}
      - name: Publish Docker image
        run: sudo docker push fredygilsolinfo/spd-staging:latest

  deploy:
    needs: build
    runs-on: [self-hosted, staging]

    steps:
      - name: Prune unused Docker objects
        run: |
          sudo docker image prune -af
          sudo docker container prune -f
          sudo docker volume prune -f
          sudo docker network prune -f
      - name: Deploy to EC2
        env:
          NODE_ENV: production
          API_URL: ${{ vars.STAGING_API_URL }}
          APP_URL: ${{ vars.STAGING_APP_URL }}
          DATABASE_URL: ${{ vars.STAGING_DATABASE_URL }}
          DPI_DEBUG_LEVEL: ${{ vars.STAGING_DPI_DEBUG_LEVEL }}
          S3_ACCESS_KEY_ID: ${{ secrets.STAGING_S3_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ vars.STAGING_S3_BUCKET }}
          S3_REGION: ${{ vars.STAGING_S3_REGION }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_S3_SECRET_ACCESS_KEY }}
          SIIF_CONNECTION_STRING_8913800073: ${{ vars.STAGING_SIIF_CONNECTION_STRING_8913800073 }}
          SIIF_CONNECTION_STRING_8914800302: ${{ vars.STAGING_SIIF_CONNECTION_STRING_8914800302 }}
          SIIF_REST_API_URL_8914800302: ${{ vars.STAGING_SIIF_REST_API_URL_8914800302 }}
          NEXT_PUBLIC_SPD_CUSTOM_TITLE: ${{ vars.STAGING_NEXT_PUBLIC_SPD_CUSTOM_TITLE }}
          TOKEN_SECRET: ${{ secrets.STAGING_TOKEN_SECRET }}
          PRISMA_CLI_BINARY_TARGETS: ${{ vars.PRISMA_CLI_BINARY_TARGETS }}
        run: |
          sudo docker stop spd-staging || true
          sudo docker rm spd-staging || true
          sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          sudo docker pull fredygilsolinfo/spd-staging:latest
          sudo docker run -d -p 80:3000 --name spd-staging \
            --add-host=host.docker.internal:host-gateway \
            -e "NODE_ENV=${{ env.NODE_ENV }}" \
            -e "API_URL=${{ env.API_URL }}" \
            -e "APP_URL=${{ env.APP_URL }}" \
            -e "DATABASE_URL=${{ env.DATABASE_URL }}" \
            -e "DPI_DEBUG_LEVEL=${{ env.DPI_DEBUG_LEVEL }}" \
            -e "NEXT_PUBLIC_SPD_CUSTOM_TITLE=\"${{ env.NEXT_PUBLIC_SPD_CUSTOM_TITLE }}\"" \
            -e "S3_ACCESS_KEY_ID=${{ env.S3_ACCESS_KEY_ID }}" \
            -e "S3_BUCKET=${{ env.S3_BUCKET }}" \
            -e "S3_REGION=${{ env.S3_REGION }}" \
            -e "S3_SECRET_ACCESS_KEY=${{ env.S3_SECRET_ACCESS_KEY }}" \
            -e "SIIF_CONNECTION_STRING_8913800073=${{ env.SIIF_CONNECTION_STRING_8913800073 }}" \
            -e "SIIF_CONNECTION_STRING_8914800302=${{ env.SIIF_CONNECTION_STRING_8914800302 }}" \
            -e "SIIF_REST_API_URL_8914800302=${{ env.SIIF_REST_API_URL_8914800302 }}" \
            -e "TOKEN_SECRET=${{ env.TOKEN_SECRET }}" \
            -e "PRISMA_CLI_BINARY_TARGETS=${{ env.PRISMA_CLI_BINARY_TARGETS }}" \
            fredygilsolinfo/spd-staging:latest
