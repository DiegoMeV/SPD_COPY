version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "API_URL=$API_URL" >> .env
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
        - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env
        - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env
        - echo "S3_REGION=$S3_REGION" >> .env
        - echo "S3_BUCKET=$S3_BUCKET" >> .env
        - echo "TOKEN_SECRET=$TOKEN_SECRET" >> .env
        - echo "SIIF_REST_API_URL_8914800302=$SIIF_REST_API_URL_8914800302" >> .env
        - echo "SIIF_REST_API_URL_890102006=$SIIF_REST_API_URL_890102006" >> .env
        - echo "APP_URL=$APP_URL" >> .env
        - echo "NEXT_PUBLIC_SPD_CUSTOM_TITLE=$NEXT_PUBLIC_SPD_CUSTOM_TITLE" >> .env
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
