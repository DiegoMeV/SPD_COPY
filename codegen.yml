overwrite: true
schema: "http://localhost:3000/api/graphql"
hooks:
  afterAllFileWrite:
    - prettier --write
documents: "./**/*.gql"
generates:
  ./graphql/gen/schema.ts:
    documents: ./**/*.gql
    plugins:
      - typescript
  ./graphql/gen/ops.ts:
    documents: ./**/*.gql
    preset: import-types
    presetConfig:
      typesPath: ./schema
    plugins:
      - typescript-operations
  ./graphql/gen/hooks.ts:
    documents: ./**/*.gql
    preset: import-types
    presetConfig:
      typesPath: ./ops
    plugins:
      - typescript-react-apollo
    config:
      withHOC: false
      withComponent: false
      withHooks: true
