version: "3.8"

services:
  app:
    container_name: spd-app
    image: spd-app-dev
    restart: always
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    build:
      context: .
      dockerfile: Dockerfile.intel.dev
    working_dir: /app
    # Mount host directory to docker container to support watch mode
    volumes:
      - .:/app
      # This ensures that the NextJS container manages the node_modules folder
      # rather than synchronizes it with the host machine
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    ports:
      - 3000:3000
    depends_on:
      - postgres
      # - oracle

  postgres:
    image: postgres:13.1
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432

