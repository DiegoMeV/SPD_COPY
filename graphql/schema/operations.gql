query GetDevPlanLevelsTree($devPlanId: Int!, $getRootAsNode: Boolean) {
  getDevPlanLevelsTree(devPlanId: $devPlanId, getRootAsNode: $getRootAsNode) {
    ...DevPlanLevel
    goalCount {
      ...GoalTypeCount
    }
    children {
      ...DevPlanLevel
      goalCount {
        ...GoalTypeCount
      }
      children {
        ...DevPlanLevel
        goalCount {
          ...GoalTypeCount
        }
        children {
          ...DevPlanLevel
          goalCount {
            ...GoalTypeCount
          }
          children {
            ...DevPlanLevel
            goalCount {
              ...GoalTypeCount
            }
          }
        }
      }
    }
  }
}

